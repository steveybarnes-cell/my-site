name: MYSite
packages:
  Supabase:
    url: 'https://github.com/supabase/supabase-swift'
    from: '2.0.0'
targets:
  MYSite:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MYSite

    dependencies:
          - package: Supabase
            product: Supabase
    settings:
      base:
        PRODUCT_NAME: MYSite
        PRODUCT_BUNDLE_IDENTIFIER: com.myprojectgroup.mpgsiterecords
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'MY Site'
        INFOPLIST_KEY_CFBundleName: 'MY Site'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSCameraUsageDescription: 'MY Site uses the camera to photograph site progress, variation work and material receipts as evidence against your daily records.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'MY Site checks your location when you clock in and out to confirm you were on the assigned site. Your location is not tracked at any other time.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'MY Site uses the microphone so you can dictate your daily site record instead of typing it.'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'MY Site accesses your photo library so you can attach existing site photos and receipts to a record or feed post.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'MY Site transcribes your dictated site notes into a written daily record.'
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    scheme:
      environmentVariables:
        'SUPABASE_ANON_KEY': 'sb_publishable_aLr4R2Og756SVAe-0vX7DA_p5hrv7xl'
        'SUPABASE_PUBLISHABLE_KEY': 'sb_publishable_aLr4R2Og756SVAe-0vX7DA_p5hrv7xl'
        'SUPABASE_URL': 'https://jzzsatsmdmckgjllohst.supabase.co'