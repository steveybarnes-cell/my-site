name: MPGSiteRecords
targets:
  MPGSiteRecords:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MPGSiteRecords

    settings:
      base:
        PRODUCT_NAME: MPGSiteRecords
        PRODUCT_BUNDLE_IDENTIFIER: app.10x.mpg-site-records
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'MPG Site Records'
        INFOPLIST_KEY_CFBundleName: 'MPG Site Records'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'This app accesses your photo library to read photos.'
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
