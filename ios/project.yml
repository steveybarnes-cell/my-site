name: MYSite
packages:
  Supabase:
    url: 'https://github.com/supabase/supabase-swift'
    from: '2.0.0'
targets:
  MYSite:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MYSite

    dependencies:
          - package: Supabase
            product: Supabase
    settings:
      base:
        PRODUCT_NAME: MYSite
        PRODUCT_BUNDLE_IDENTIFIER: app.10x.my-site
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'MY Site'
        INFOPLIST_KEY_CFBundleName: 'MY Site'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 'MPG Site Records uses the camera so you can take before, during and completion photos of your work and capture supplier receipts on site. Photos are timestamped and attached to the job.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'MPG Site Records uses your location only when you clock in or out, or upload site evidence, to confirm you are on or near the allocated site. Your location is never tracked continuously in the background.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'MPG Site Records uses the microphone so you can speak your daily site record instead of typing it. Audio is transcribed on your device and is not stored.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'MPG Site Records can save site photos you capture back to your photo library.'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'MPG Site Records lets you attach existing photos, receipts and supplier invoices from your library to a job or daily record.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'MPG Site Records transcribes the daily site record you speak so it can auto-fill your times, work done and delays for you to review.'
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
    scheme:
      environmentVariables:
        'SUPABASE_ANON_KEY': 'sb_publishable_aLr4R2Og756SVAe-0vX7DA_p5hrv7xl'
        'SUPABASE_PUBLISHABLE_KEY': 'sb_publishable_aLr4R2Og756SVAe-0vX7DA_p5hrv7xl'
        'SUPABASE_URL': 'https://jzzsatsmdmckgjllohst.supabase.co'